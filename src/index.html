<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Tareas</title>

    <link rel="stylesheet" href="style.css">

    <!-- Iconify -->
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

    <!-- JavaScript -->
    <script src="app.js" defer></script>
</head>

<body>

    <!-- Sidebar -->
    <aside class="sidebar">

        <header class="sidebar-header">

            <div class="image-text">

                <img src="aset/profil.png" alt="perfil">

                <div class="header-text">
                    <span class="name">Miguel Angel Nat</span>
                    <span class="email">miguel.nat@gmail.com</span>
                </div>

            </div>

        </header>

        <!-- Buscador -->
        <div class="search-bar">

            <iconify-icon
                icon="fluent:search-20-regular"
                class="search-icon">
            </iconify-icon>

            <input
                type="text"
                placeholder="Buscar"
                autocomplete="off">

        </div>

        <!-- Navegación -->
        <nav class="nav">

            <a href="#" class="nav-item active">

                <iconify-icon icon="fluent:sun-20-regular"></iconify-icon>

                <span>Mi día</span>

            </a>

            <a href="#" class="nav-item">

                <iconify-icon icon="fluent:leaf-20-regular"></iconify-icon>

                <span>Planeado</span>

            </a>

            <a href="#" class="nav-item">

                <iconify-icon icon="fluent:person-20-regular"></iconify-icon>

                <span>Asignadas a mí</span>

            </a>

            <a href="#" class="nav-item">

                <iconify-icon icon="fluent:flag-20-regular"></iconify-icon>

                <span>Correo marcado</span>

            </a>

            <a href="#" class="nav-item">

                <iconify-icon icon="fluent:home-20-regular"></iconify-icon>

                <span>Tareas</span>

            </a>

        </nav>

        <!-- Listas -->
        <div class="sidebar-lists"></div>

        <!-- Footer -->
        <div class="sidebar-footer">

            <button class="footer-btn" id="btnNewList">

                <iconify-icon
                    icon="fluent:page-add-20-regular">
                </iconify-icon>

                <span>Nueva lista</span>

            </button>

            <button class="footer-btn" id="btnNewGroup">

                <iconify-icon
                    icon="fluent:group-20-regular">
                </iconify-icon>

                <span>Nuevo grupo</span>

            </button>

        </div>

    </aside>


    <!-- Main -->
    <main class="main" id="mainContent">

        <!-- Barra superior -->
        <div class="top-bar">

            <div class="top-bar-left">

                <!-- Expandir / Restaurar -->
                <button
                    class="icon-btn"
                    id="btnMinimize"
                    title="Expandir">

                    <iconify-icon
                        icon="fluent:resize-small-20-regular">
                    </iconify-icon>

                </button>

            </div>


            <div class="top-bar-right">

                <!-- Sugerencias -->
                <button
                    class="icon-btn"
                    id="btnSuggestions"
                    title="Sugerencias">

                    <iconify-icon
                        icon="fluent:lightbulb-20-regular">
                    </iconify-icon>

                </button>


                <!-- Menú -->
                <button
                    class="icon-btn"
                    id="btnMenu"
                    title="Menú">

                    <iconify-icon
                        icon="fluent:more-horizontal-20-regular">
                    </iconify-icon>

                </button>

            </div>

        </div>


        <!-- Contenido -->
        <div class="content">

            <!-- Fecha -->
            <div class="date-header">

                <div
                    class="date-number"
                    id="dateNumber">
                </div>

                <div class="date-info">

                    <span id="dateText"></span>

                    <span id="dateMonth"></span>

                    <span id="dateYear"></span>

                </div>

            </div>


            <!-- Tarjeta motivacional -->
            <div
                class="motivational-card"
                id="motivationalCard">

                <div class="card-icon">

                    <iconify-icon
                        icon="fluent:calendar-48-regular">
                    </iconify-icon>

                </div>

                <h2 class="card-title">
                    Hoy es tu día para brillar
                </h2>

                <p class="card-message">
                    Cada tarea que completas te acerca a la persona
                    que estás construyendo. Un paso a la vez,
                    sin prisa, sin excusas.
                </p>

            </div>


            <!-- Lista de tareas -->
            <div
                class="tasks"
                id="tasksContainer">
            </div>


            <!-- Agregar tarea -->
            <div class="add-task">

                <form id="taskForm">

                    <iconify-icon
                        icon="fluent:add-20-regular"
                        class="add-icon">
                    </iconify-icon>

                    <input
                        type="text"
                        name="tasktext"
                        placeholder="Agregar una tarea"
                        autocomplete="off">

                </form>

            </div>

        </div>

    </main>


    <!-- Menú contextual -->
    <div
        class="context-menu"
        id="contextMenu">

        <div
            class="context-item"
            data-action="complete">

            <iconify-icon
                icon="fluent:checkmark-circle-20-regular">
            </iconify-icon>

            <span>
                Marcar como completada
            </span>

        </div>


        <div
            class="context-item"
            data-action="important">

            <iconify-icon
                icon="fluent:star-20-filled">
            </iconify-icon>

            <span>
                Marcar como importante
            </span>

        </div>


        <div
            class="context-item"
            data-action="delete">

            <iconify-icon
                icon="fluent:delete-20-regular">
            </iconify-icon>

            <span>
                Eliminar
            </span>

        </div>

    </div>

</body>

</html>
