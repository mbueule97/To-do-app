<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión — To-Do</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-card">
        <div class="auth-logo">
          <iconify-icon
            icon="fluent:checkmark-circle-48-regular"
          ></iconify-icon>
        </div>

        <div class="auth-tabs">
          <button class="tab active" data-tab="login">Iniciar sesión</button>
          <button class="tab" data-tab="register">Crear cuenta</button>
        </div>

        <!-- Login -->
        <form id="loginForm" class="auth-form active">
          <label for="loginEmail">Correo electrónico</label>
          <input
            type="email"
            id="loginEmail"
            placeholder="tu@correo.com"
            required
            autocomplete="email"
          />

          <label for="loginPassword">Contraseña</label>
          <div class="input-password">
            <input
              type="password"
              id="loginPassword"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
            <button type="button" class="toggle-password" id="toggleLoginPass">
              <iconify-icon icon="fluent:eye-20-regular"></iconify-icon>
            </button>
          </div>

          <div class="auth-error" id="loginError"></div>
          <button type="submit" class="auth-btn">Entrar</button>
        </form>

        <!-- Register -->
        <form id="registerForm" class="auth-form">
          <label for="regName">Nombre</label>
          <input
            type="text"
            id="regName"
            placeholder="Tu nombre"
            required
            autocomplete="name"
          />

          <label for="regEmail">Correo electrónico</label>
          <input
            type="email"
            id="regEmail"
            placeholder="tu@correo.com"
            required
            autocomplete="email"
          />

          <label for="regPassword">Contraseña</label>
          <div class="input-password">
            <input
              type="password"
              id="regPassword"
              placeholder="Mínimo 6 caracteres"
              required
              minlength="6"
              autocomplete="new-password"
            />
            <button type="button" class="toggle-password" id="toggleRegPass">
              <iconify-icon icon="fluent:eye-20-regular"></iconify-icon>
            </button>
          </div>

          <div class="auth-error" id="regError"></div>
          <button type="submit" class="auth-btn">Crear cuenta</button>
        </form>
      </div>
    </div>

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script type="module" src="login.js"></script>
  </body>
</html>
